name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Report APK contents and test results
        if: always()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            LIBS=$(unzip -l "$APK" | grep -E 'lib/.*\.so' | awk '{print $1" "$4}' | tr '\n' ';')
            echo "::notice title=APK::$(stat -c %s "$APK") bytes. native libs: ${LIBS:-none}"
          else
            echo "::error title=APK::app-debug.apk was not produced"
          fi
          CACHE=$(find app -name CMakeCache.txt 2>/dev/null | head -1)
          if [ -n "$CACHE" ]; then
            echo "::notice title=Native build::$CACHE $(grep -E '^CMAKE_BUILD_TYPE:|^ANDROID_ABI:|^CMAKE_C_FLAGS_RELEASE:' "$CACHE" | tr '\n' ' ')"
          else
            echo "::warning title=Native build::no CMakeCache.txt found under app/"
          fi
          CC=$(find app -name 'compile_commands.json*' 2>/dev/null | head -1)
          if [ -n "$CC" ]; then
            O3=$(zcat -f "$CC" | grep -c -- ' -O3' || true)
            O0=$(zcat -f "$CC" | grep -c -- ' -O0' || true)
            GGML=$(zcat -f "$CC" | grep -E 'ggml-cpu/(quants|ops)\.c' | head -1 | grep -oE ' -O[0-3s]| -march=[^ ]*| -mcpu=[^ ]*| -DNDEBUG' | tr '\n' ' ')
            echo "::notice title=Compile flags::commands with -O3: $O3, with -O0: $O0; ggml flags: $GGML"
          fi
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          total = bad = 0
          lines = []
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              for tc in ET.parse(path).getroot().iter("testcase"):
                  total += 1
                  failed = tc.find("failure") is not None or tc.find("error") is not None
                  bad += failed
                  lines.append(("FAIL " if failed else "ok ") + tc.get("name"))
          print("::notice title=Unit tests::total=%d failed=%d | %s" % (total, bad, "; ".join(lines)))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: montage-ai-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
